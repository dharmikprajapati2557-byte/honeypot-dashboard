{% extends "base.html" %}
{% block body %}
<div class="topbar">
  <div class="brand">HONEY<span>NET</span> // CONTROL <span class="badge-live">● LIVE</span></div>
  <div class="clock" id="clock"></div>
  <div>
    <span class="muted">{{ username }}</span> &nbsp;
    <a href="{{ url_for('logout') }}">[logout]</a>
  </div>
</div>
<div class="wrap">
  <div class="sidebar">
    <div class="icon" title="Overview">◈</div>
    <div class="icon" title="Protocols">⌁</div>
    <div class="icon" title="Feed">☰</div>
    <div class="icon" title="Export" onclick="window.location='/api/export'">⇩</div>
  </div>
  <div class="main">

    <div class="grid" style="margin-bottom:20px;">
      <div class="card"><h3>TOTAL CONNECTIONS</h3><div class="metric" id="m-total">0</div></div>
      <div class="card"><h3>UNIQUE SOURCE IPs</h3><div class="metric" id="m-ips">0</div></div>
      <div class="card"><h3>AUTH ATTEMPTS CAPTURED</h3><div class="metric" id="m-auth">0</div></div>
      <div class="card"><h3>ACTIVE PROTOCOLS</h3><div class="metric" id="m-active">0/6</div></div>
    </div>

    <div class="grid">
      <div class="card" style="grid-column:span 2;">
        <h3>PROTOCOL CONTROL</h3>
        <div id="protocol-controls"></div>
      </div>

      <div class="card" style="grid-column:span 2;">
        <h3>LIVE EVENT FEED</h3>
        <div>
          Filter:
          <select id="feed-filter">
            <option value="all">all</option>
            <option value="http">http</option>
            <option value="ftp">ftp</option>
            <option value="ssh">ssh</option>
            <option value="telnet">telnet</option>
            <option value="smb">smb</option>
            <option value="snmp">snmp</option>
          </select>
        </div>
        <div class="feed" id="feed"></div>
      </div>

      <div class="card" style="grid-column:span 2;">
        <h3>CAPTURED CREDENTIALS</h3>
        <div class="feed" id="auth-feed"></div>
      </div>
    </div>
  </div>
</div>

<script>
const PROTOS = ["http","ftp","ssh","telnet","smb","snmp"];
const BANNER_PROFILES = {{ banner_profiles | tojson }};

function renderControls(status){
  const el = document.getElementById('protocol-controls');
  el.innerHTML = "";
  let activeCount = 0;
  PROTOS.forEach(p=>{
    const s = status[p] || {};
    if(s.running) activeCount++;
    const opts = Object.keys(BANNER_PROFILES[p]).map(k=>
      `<option value="${k}" ${k===s.banner_key?'selected':''}>${k}</option>`).join("");
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div style="width:70px; text-transform:uppercase; color:var(--cyan);">${p}</div>
      <div class="muted" style="width:70px;">:${s.port||''}</div>
      <select onchange="setBanner('${p}', this.value)">${opts}</select>
      <span class="pill ${s.running?'on':'off'}">${s.running?'ONLINE':'OFFLINE'}</span>
      <button onclick="toggle('${p}', ${s.running})" class="${s.running?'danger':''}">${s.running?'STOP':'START'}</button>
    `;
    el.appendChild(row);
  });
  document.getElementById('m-active').textContent = activeCount + "/" + PROTOS.length;
}

async function toggle(proto, running){
  await fetch(`/api/protocol/${proto}/${running?'stop':'start'}`, {method:'POST'});
  refreshStatus();
}
async function setBanner(proto, key){
  await fetch(`/api/protocol/${proto}/banner`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({banner_key:key})
  });
}

async function refreshStatus(){
  const r = await fetch('/api/status'); renderControls(await r.json());
}
async function refreshStats(){
  const r = await fetch('/api/stats'); const s = await r.json();
  document.getElementById('m-total').textContent = s.total_connections;
  document.getElementById('m-ips').textContent = s.unique_ips;
  document.getElementById('m-auth').textContent = s.auth_attempts;
}
async function refreshFeed(){
  const proto = document.getElementById('feed-filter').value;
  const r = await fetch(`/api/events?protocol=${proto}&limit=80`);
  const events = await r.json();
  const el = document.getElementById('feed');
  el.innerHTML = events.map(e=>{
    const t = new Date(e.ts*1000).toLocaleTimeString();
    return `<div class="line evt-${e.event_type}"><span class="muted">${t}</span> [<span class="proto">${e.protocol}</span>] <span class="ip">${e.src_ip}</span> ${e.event_type} ${e.detail?('- '+e.detail):''}</div>`;
  }).join("");
}
async function refreshAuth(){
  const r = await fetch('/api/auth-attempts?limit=50');
  const rows = await r.json();
  const el = document.getElementById('auth-feed');
  el.innerHTML = rows.map(a=>{
    const t = new Date(a.ts*1000).toLocaleTimeString();
    return `<div class="line"><span class="muted">${t}</span> [<span class="proto">${a.protocol}</span>] <span class="ip">${a.src_ip}</span> user=<b>${a.username||''}</b> pass=<b>${a.password||''}</b></div>`;
  }).join("");
}

document.getElementById('feed-filter').addEventListener('change', refreshFeed);

refreshStatus(); refreshStats(); refreshFeed(); refreshAuth();
setInterval(refreshStatus, 4000);
setInterval(refreshStats, 4000);
setInterval(refreshFeed, 3000);
setInterval(refreshAuth, 4000);
</script>
{% endblock %}
