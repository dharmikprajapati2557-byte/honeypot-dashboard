<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}HONEYNET // CONTROL{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050810; --panel:rgba(10,20,35,0.65); --border:#0ff3ff55;
  --cyan:#00f0ff; --magenta:#ff2ec4; --green:#39ff9e; --amber:#ffb020; --red:#ff3b3b;
  --text:#cdefff; --muted:#6f8ea3;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Share Tech Mono', monospace;
  background-image:
    linear-gradient(rgba(0,240,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,0.04) 1px, transparent 1px);
  background-size:34px 34px;
  min-height:100vh;
}
h1,h2,h3,.brand{font-family:'Orbitron', sans-serif;}
a{color:var(--cyan);}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 26px; border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, rgba(0,240,255,0.06), transparent);
}
.brand{font-weight:900; letter-spacing:3px; font-size:20px; color:var(--cyan); text-shadow:0 0 12px var(--cyan);}
.brand span{color:var(--magenta); text-shadow:0 0 12px var(--magenta);}
.clock{color:var(--muted); font-size:13px;}
.badge-live{
  display:inline-block; padding:2px 10px; border:1px solid var(--green); border-radius:20px;
  color:var(--green); font-size:11px; box-shadow:0 0 10px var(--green); margin-left:14px;
}
.wrap{display:flex; min-height:calc(100vh - 60px);}
.sidebar{
  width:64px; border-right:1px solid var(--border); display:flex; flex-direction:column;
  align-items:center; padding-top:20px; gap:22px;
}
.sidebar .icon{
  width:38px; height:38px; border:1px solid var(--border); border-radius:8px;
  display:flex; align-items:center; justify-content:center; color:var(--cyan);
  cursor:pointer; transition:.2s;
}
.sidebar .icon:hover{box-shadow:0 0 14px var(--cyan); background:rgba(0,240,255,0.08);}
.main{flex:1; padding:22px;}
.grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:18px;}
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
  padding:16px 18px; backdrop-filter:blur(6px);
  box-shadow:0 0 0 rgba(0,240,255,0); transition:box-shadow .25s, transform .2s;
  position:relative; overflow:hidden;
}
.card:hover{box-shadow:0 0 22px rgba(0,240,255,0.35); transform:translateY(-2px);}
.card::before{
  content:""; position:absolute; top:0; left:-100%; width:100%; height:2px;
  background:linear-gradient(90deg, transparent, var(--cyan), transparent);
  animation:scan 5s linear infinite;
}
@keyframes scan{ to{left:100%;} }
.card h3{margin:0 0 10px 0; font-size:14px; color:var(--cyan); letter-spacing:1px;}
.metric{font-size:30px; font-weight:700; color:var(--text); text-shadow:0 0 8px rgba(0,240,255,0.4);}
.muted{color:var(--muted); font-size:12px;}
.row{display:flex; align-items:center; justify-content:space-between; margin:6px 0;}
.pill{padding:2px 8px; border-radius:20px; font-size:11px; border:1px solid;}
.pill.on{color:var(--green); border-color:var(--green); box-shadow:0 0 8px var(--green);}
.pill.off{color:var(--red); border-color:var(--red); box-shadow:0 0 8px var(--red);}
select, button, input{
  background:#08101c; color:var(--text); border:1px solid var(--border);
  border-radius:6px; padding:6px 8px; font-family:inherit;
}
button{cursor:pointer; color:var(--cyan); border-color:var(--cyan);}
button:hover{box-shadow:0 0 10px var(--cyan);}
button.danger{color:var(--red); border-color:var(--red);}
button.danger:hover{box-shadow:0 0 10px var(--red);}
.feed{max-height:340px; overflow-y:auto; font-size:12px;}
.feed .line{padding:4px 0; border-bottom:1px dashed #0ff3ff22;}
.feed .ip{color:var(--magenta);}
.feed .proto{color:var(--cyan);}
.feed .evt-auth_attempt, .feed .evt-connect{color:var(--amber);}
.center{display:flex; align-items:center; justify-content:center; min-height:80vh;}
.authbox{
  background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:34px;
  width:340px; box-shadow:0 0 30px rgba(0,240,255,0.25);
}
.authbox h2{color:var(--cyan); text-align:center;}
.authbox input{width:100%; margin-bottom:12px;}
.authbox button{width:100%;}
.error{color:var(--red); font-size:12px; margin-bottom:10px;}
</style>
</head>
<body>
{% block body %}{% endblock %}
<script>
function tickClock(){
  const el = document.getElementById('clock');
  if(el) el.textContent = new Date().toLocaleString();
}
setInterval(tickClock, 1000); tickClock();
</script>
</body>
</html>
